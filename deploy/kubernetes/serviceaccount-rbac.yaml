apiVersion: v1
kind: ServiceAccount
metadata:
  name: ggagent-sa
  namespace: agent-system
  labels:
    app.kubernetes.io/name: ggagent
    app.kubernetes.io/part-of: ckodex-ggagent-cli
automountServiceAccountToken: true
---
# Strict Least-Authority RBAC: Only read ConfigMaps and Events in agent-system namespace.
# Never assign cluster-admin or broad mutating cluster roles to an autonomous agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ggagent-scoped-role
  namespace: agent-system
  labels:
    app.kubernetes.io/name: ggagent
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ggagent-scoped-binding
  namespace: agent-system
subjects:
  - kind: ServiceAccount
    name: ggagent-sa
    namespace: agent-system
roleRef:
  kind: Role
  name: ggagent-scoped-role
  apiGroup: rbac.authorization.k8s.io
