# CKODEX High-Assurance Egress Fencing via Cilium eBPF
# Enforces an absolute, un-bypassable kernel drop on Cloud Instance Metadata (IMDS)
# taking precedence over any additive allow NetworkPolicies.
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ggagent-drop-imds-egress"
  labels:
    app.kubernetes.io/name: ggagent
    app.kubernetes.io/part-of: ckodex-ggagent-cli
spec:
  description: "Drop all egress to AWS/Azure/GCP Instance Metadata Services (IPv4 & IPv6)"
  nodeSelector: {}
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: ckodex-ggagent-cli
  egressDeny:
    - toCIDRSet:
        - cidr: "169.254.169.254/32"
        - cidr: "fd00:ec2::254/128" # IPv6 IMDS (AWS/Azure)
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
