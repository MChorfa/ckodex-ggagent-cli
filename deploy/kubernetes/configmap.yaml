apiVersion: v1
kind: ConfigMap
metadata:
  name: ggagent-config
  namespace: agent-system
  labels:
    app.kubernetes.io/name: ggagent
    app.kubernetes.io/part-of: ckodex-ggagent-cli
data:
  agent-card.json: |
    {
      "name": "CKODEX In-Cluster Agent Gateway",
      "version": "0.2.0",
      "description": "Governed In-Cluster A2A & ARD Agent Platform with 77 Subagent Strategies",
      "protocol_version": "A2A/1.0",
      "authority": {
        "root_fabric": "thales-trt-canada",
        "tenant": "cluster-default",
        "namespace": "agent-system",
        "role": "AgentPlatformGateway"
      },
      "capabilities": [
        "a2a.jsonrpc.v1",
        "ard.discovery.v1",
        "audit.spdx.v2",
        "mesh.dag.v1",
        "eval.conformal.v1"
      ],
      "interfaces": {
        "a2a_rpc": "/api/v1/a2a",
        "a2a_events": "/api/v1/a2a/events",
        "ard_discovery": "/.well-known/ard.json",
        "health": "/healthz"
      }
    }
